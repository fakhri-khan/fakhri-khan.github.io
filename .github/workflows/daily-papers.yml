name: Update daily research papers

on:
  push:
    paths:
      - ".github/workflows/daily-papers.yml"
      - "scripts/update_daily_papers.py"
      - "data/venue-config.json"
  schedule:
    # Start at 08:00 Riyadh, then retry off the hour through 09:50 Riyadh.
    - cron: "0 5 * * *"
    - cron: "5,20,35,50 5,6 * * *"
  workflow_dispatch:

concurrency:
  group: daily-research-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Check whether today's scheduled edition is already published
        id: freshness
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Riyadh"))
          today = now.date().isoformat()
          scheduled_cutoff = now.replace(hour=8, minute=0, second=0, microsecond=0)
          archive = json.loads(Path("data/daily-papers.json").read_text(encoding="utf-8"))
          already_published_after_cutoff = False
          for day in archive.get("days", []):
              if day.get("date") != today:
                  continue
              generated_at = day.get("generatedAt")
              if not generated_at:
                  continue
              try:
                  generated_at = datetime.fromisoformat(generated_at)
              except (TypeError, ValueError):
                  continue
              if generated_at.tzinfo is None:
                  generated_at = generated_at.replace(tzinfo=ZoneInfo("Asia/Riyadh"))
              already_published_after_cutoff = generated_at.astimezone(ZoneInfo("Asia/Riyadh")) >= scheduled_cutoff
              break
          should_run = not (os.getenv("GITHUB_EVENT_NAME") == "schedule" and already_published_after_cutoff)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={str(should_run).lower()}\n")
          print("Running today's paper update." if should_run else "Today's edition was generated after 08:00 Riyadh; skipping this scheduled retry.")
          PY
      - name: Set up Python
        if: steps.freshness.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and summarize new papers
        if: steps.freshness.outputs.run == 'true'
        env:
          PAPER_LOOKBACK_DAYS: "7"
          CROSSREF_MAILTO: fakhri.khan@kfupm.edu.sa
        run: python scripts/update_daily_papers.py --refresh-today
      - name: Validate generated archive
        if: steps.freshness.outputs.run == 'true'
        run: |
          python -m json.tool data/daily-papers.json >/dev/null
          python - <<'PY'
          import json
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          data = json.loads(Path("data/daily-papers.json").read_text(encoding="utf-8"))
          if data.get("timezone") != "Asia/Riyadh":
              raise SystemExit("archive timezone is not Asia/Riyadh")
          if len(data.get("tracks", [])) != 5:
              raise SystemExit("archive must contain five research tracks")
          seen = set()
          for day in data.get("days", []):
              if not isinstance(day.get("date"), str) or not isinstance(day.get("papers"), list):
                  raise SystemExit("invalid daily edition")
              counts = {}
              for paper in day["papers"]:
                  if not paper.get("title") or not (paper.get("doi") or paper.get("arxivId")) or not paper.get("trackId"):
                      raise SystemExit("paper is missing a title, DOI/arXiv ID, or track")
                  key = ("doi:" + paper["doi"].lower().strip()) if paper.get("doi") else ("arxiv:" + paper["arxivId"].lower().strip())
                  if key in seen:
                      raise SystemExit("duplicate DOI in archive")
                  seen.add(key)
                  counts[paper["trackId"]] = counts.get(paper["trackId"], 0) + 1
              if any(count > 2 for count in counts.values()):
                  raise SystemExit("a daily edition contains more than two papers in a track")
          today = datetime.now(ZoneInfo("Asia/Riyadh")).date().isoformat()
          today_edition = next((day for day in data.get("days", []) if day.get("date") == today), None)
          if today_edition is not None:
              arxiv_counts = {}
              for paper in today_edition.get("papers", []):
                  if str(paper.get("source", "")).lower() == "arxiv":
                      track_id = paper.get("trackId")
                      arxiv_counts[track_id] = arxiv_counts.get(track_id, 0) + 1
              if any(count > 1 for count in arxiv_counts.values()):
                  raise SystemExit("today's edition contains more than one arXiv paper in a track")
          raw = Path("data/daily-papers.json").read_text(encoding="utf-8")
          if "OPENAI_API_KEY" in raw or re.search(r"sk-[A-Za-z0-9]{20,}", raw):
              raise SystemExit("secret-like material found in archive")
          print(f"validated {len(seen)} archived papers across {len(data.get('days', []))} editions")
          PY
      - name: Publish updated archive
        if: steps.freshness.outputs.run == 'true'
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-papers.json
          if git diff --cached --quiet; then
            echo "No new papers were found."
          else
            git commit -m "Update daily research paper archive"
            git push
          fi
