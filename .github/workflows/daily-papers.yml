name: Update daily research papers

on:
  schedule:
    # 05:00 UTC is 08:00 in Riyadh (UTC+3).
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and summarize new papers
        working-directory: .
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PAPER_SUMMARY_MODEL: ${{ vars.PAPER_SUMMARY_MODEL }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
        run: python scripts/update_daily_papers.py

      - name: Publish updated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-papers.json
          if git diff --cached --quiet; then
            echo "No new papers were found."
          else
            git commit -m "Update daily research paper archive"
            git push
          fi
